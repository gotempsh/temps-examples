name: Rust Axum production runtime

on:
  push:
    branches: [main]
    paths: ["examples/docker/rust-axum/**", "scripts/smoke-rust-axum.py", ".github/workflows/rust-axum-runtime.yml"]
  pull_request:
    paths: ["examples/docker/rust-axum/**", "scripts/smoke-rust-axum.py", ".github/workflows/rust-axum-runtime.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/smoke-rust-axum.py
